services:
  - type: web
    name: royal-horse-race-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn bot:flask_app
    plan: free
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      - key: WEB_URL
        sync: false
      - key: BOT_USERNAME
        sync: false
